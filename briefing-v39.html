<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차티 글로벌 마켓 v3.9</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#090e1a;color:#eff4ff}*{box-sizing:border-box}body{max-width:950px;margin:auto;padding:20px 14px 60px}h1{font-size:25px;margin:8px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:10px 0}p{line-height:1.6}.sub{color:#a8bbd6;font-size:12px;line-height:1.6}.card{background:#121d31;border:1px solid #31415e;border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:#1b2942;border:1px solid #364b6c;padding:12px;border-radius:11px}.stat b{display:block;font-size:20px;margin:7px 0}.up{color:#ff9191}.down{color:#89c0ff}.warn{color:#ffd38b}.good{color:#94e1be}.line{padding:10px 0;border-bottom:1px solid #2c3d57}a{color:#a4ccff;overflow-wrap:anywhere}button{background:#426cf5;color:white;border:0;border-radius:9px;padding:10px 12px;font-weight:700;cursor:pointer}header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.actions{display:flex;gap:7px;flex-wrap:wrap}.hint{font-size:12px;color:#a8bbd6;margin:7px 0}.tag{font-size:12px;border:1px solid #62728e;border-radius:20px;padding:4px 8px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media print{.actions,.hint{display:none!important}body{max-width:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}.card{break-inside:avoid}}
</style></head><body><header><div><div class="sub">CHATI · GLOBAL MARKET INTELLIGENCE</div><h1>글로벌 마켓 브리핑 <span class="tag">v3.9</span></h1><div id="clock" class="sub">자료 불러오는 중…</div></div><div><div class="actions" id="actions"><button id="refresh">새로고침</button><button id="capture">📸 전체 캡처</button><button id="share">↗ 공유</button><button id="print">PDF 저장</button></div><div class="hint" id="captureStatus" role="status"></div></div></header>
<section class="card"><h2>오늘 분석의 유효성</h2><div id="status"></div></section>
<section class="card"><h2>🇰🇷 국내 시장 실제 종가 <span class="tag">신규</span></h2><div id="domestic" class="grid"></div><p class="sub" id="domesticNote"></p></section>
<section class="card"><h2>🇺🇸 미국 시장 4대 지표</h2><div id="markets" class="grid"></div><p class="sub">미국과 한국은 거래일 및 마감 시각이 다릅니다. 숫자 비교는 인과관계나 예측 적중을 뜻하지 않습니다.</p></section>
<section class="card"><h2>미국 시장 → 국내 실제 결과 비교</h2><div id="comparison"></div></section>
<section class="card"><h2>국내 업종 영향 · 조건부 관찰</h2><div id="impact"></div></section>
<section class="card"><h2>장 시작 후 확인할 신호</h2><div id="watch"></div></section>
<section class="card"><h2>코스피·코스닥 기존 시나리오</h2><div id="scenarios"></div></section>
<section class="card"><h2>근거 뉴스와 출처</h2><div id="news"></div></section>
<section class="card"><h2>검증 기록</h2><div id="history" class="sub"></div></section>
<section class="card"><h2>자료 및 한계</h2><div id="warnings" class="sub"></div></section>
<script>
'use strict';const $=id=>document.getElementById(id);function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n}function add(p,tag,text,cls){const n=el(tag,text,cls);p.append(n);return n}function reset(id){const n=$(id);n.replaceChildren();return n}function pct(x){return typeof x==='number'&&Number.isFinite(x)?(x>0?'+':'')+x.toFixed(2)+'%':'자료 없음'}function age(x){const t=Date.parse(x||'');return Number.isFinite(t)?(Date.now()-t)/3600000:null}async function get(file){try{const r=await fetch('./data/'+file+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return await r.json()}catch{return null}}function stat(parent,x,label,unit){let b=el('div',undefined,'stat');add(b,'div',label,'sub');add(b,'b',x?.status==='ok'?pct(x.change_percent):'자료 없음',x?.change_percent>0?'up':'down');if(x?.status==='ok'){add(b,'div',(Number(x.close)||0).toLocaleString('ko-KR')+' '+unit,'sub');add(b,'div',x.market_date||'기준일 미상','sub');if(x.stale_from_previous_run)add(b,'div','이전 수집값','warn')}else add(b,'div','수집 대기/실패','warn');parent.append(b)}function row(parent,title,body){let p=el('div',undefined,'line');add(p,'h3',title);add(p,'div',body,'sub');parent.append(p)}
function render(v,m,a,h,d){const mAge=age(m?.generated_at_utc),vAge=age(v?.generated_at_kst),dAge=age(d?.generated_at_utc);$('clock').textContent='화면 확인: '+new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' · 브리핑 생성: '+(v?.generated_at_kst||'없음');let s=reset('status');add(s,'strong',mAge!==null&&mAge>=0&&mAge<=12&&vAge!==null&&vAge>=0&&vAge<=24?'참고 데이터 갱신 확인':'주의 · 일부 자료 오래되었거나 없음','warn');add(s,'p','미국 스냅샷 '+(mAge===null?'없음':mAge.toFixed(1)+'시간 전')+' · 국내 종가 수집 '+(dAge===null?'없음':dAge.toFixed(1)+'시간 전')+' · 뉴스 브리핑 '+(vAge===null?'없음':vAge.toFixed(1)+'시간 전'),'sub');add(s,'p',a?.analysis_mode==='premarket_reference'&&a?.eligible_for_prediction_record===true?'사전 분석 모드 · 적중률 별도 검증 필요':'v3.3 사전 예측 유효성 미확인 · 사후 참고 분석','warn');
let domestic=reset('domestic');for(let [key,name,unit] of [['kospi','코스피','pt'],['kosdaq','코스닥','pt'],['samsung','삼성전자','원'],['skhynix','SK하이닉스','원']])stat(domestic,d?.markets?.[key],name,unit);$('domesticNote').textContent='출처: '+(d?.source||'국내 수집 파일 없음 · GitHub Actions v3.9 실행 필요')+' · 실시간 호가가 아닌 일별 종가 · 16:10 KST 평일 갱신 시도';let us=reset('markets');for(let [key,name,unit] of [['sp500','S&P 500','pt'],['nasdaq','나스닥','pt'],['sox','반도체 SOX','pt'],['usdkrw','달러/원','원']])stat(us,m?.markets?.[key],name,unit);
let compare=reset('comparison');for(let [uk,dk,title] of [['sp500','kospi','S&P 500 ↔ 코스피'],['nasdaq','kosdaq','나스닥 ↔ 코스닥'],['sox','samsung','SOX ↔ 삼성전자'],['sox','skhynix','SOX ↔ SK하이닉스']]){let u=m?.markets?.[uk],k=d?.markets?.[dk];if(u?.status==='ok'&&k?.status==='ok'){let same=Math.sign(u.change_percent)===Math.sign(k.change_percent);row(compare,title,'미국 '+pct(u.change_percent)+' ('+u.market_date+') / 국내 '+pct(k.change_percent)+' ('+k.market_date+') · 방향 '+(same?'일치':'불일치')+' · 서로 다른 거래일의 단순 참고 비교')}else row(compare,title,'비교할 국내/미국 데이터 부족')}add(compare,'p','방향 일치율은 예측 적중률이 아닙니다. 사전 시점·대상 거래일이 검증되지 않았으므로 성능 수치를 계산하지 않습니다.','warn');
let impact=reset('impact');for(let [key,name,positive,negative,check,invert] of [['sox','반도체 · 삼성전자 / SK하이닉스','미국 반도체 강세가 투자심리에 우호적일 수 있음','미국 반도체 약세가 변동성 확대 요인일 수 있음','국내 반도체 거래대금·외국인 순매수',false],['nasdaq','국내 성장주 · 코스닥','미국 기술주 강세가 투자심리에 우호적일 수 있음','미국 기술주 약세가 부담일 수 있음','코스닥 거래대금·미국 금리',false],['usdkrw','환율 · 외국인 수급','원화 강세가 외국인 수급에 우호적일 수 있음','원화 약세가 외국인 수급 부담일 수 있음','원/달러 장중 변화·외국인 현물/선물',true]]){let x=m?.markets?.[key],t=x?.status!=='ok'||mAge===null||mAge>12?'시장 데이터 오래됨/없음':Math.abs(x.change_percent)<.3?'뚜렷한 방향 신호 없음':((x.change_percent>0)!==invert?positive:negative);row(impact,name,t+' · 확인: '+check)}let watch=reset('watch');for(let t of ['08:00 NXT 개장 이후 갭·거래대금 확인','09:00 정규장 초반 15~30분 외국인 수급·상승 종목 확산 확인','삼성전자·SK하이닉스 실제 가격 흐름과 SOX 방향 비교','시장 기준일이 오래되거나 다르면 신규 방향 판단 보류'])add(watch,'div','• '+t,'line');let sc=reset('scenarios');add(sc,'p','분석 모드: '+(a?.analysis_mode||'없음'),'sub');for(let x of a?.scenarios||[])row(sc,(x.market==='kospi'?'코스피':x.market==='kosdaq'?'코스닥':x.market)+' · '+x.bias,x.reason||'');if(!a?.scenarios?.length)add(sc,'p','시나리오 없음');let news=reset('news');for(let x of (v?.headlines||[]).slice(0,12)){let p=el('div',undefined,'line');if(/^https:\/\//.test(x.url||'')){let link=el('a',x.title||'기사 보기');link.href=x.url;link.target='_blank';link.rel='noopener noreferrer';p.append(link)}add(p,'div',(x.source||'')+' · '+(x.published_at_utc||''),'sub');news.append(p)}if(!v?.headlines?.length)add(news,'p','최근 뉴스 없음');let history=reset('history');let records=h?.records;add(history,'p',Array.isArray(records)?'저장된 예측 기록 '+records.length+'건':'예측 기록 파일 없음');add(history,'p','사전 예측의 발행 시각과 실제 대상 거래일을 연결한 검증이 마련되기 전까지 적중률을 표시하지 않습니다.');let warnings=reset('warnings');for(let t of ['국내/미국 시세는 Yahoo Finance의 비공식 일별 종가이며 지연·휴장·수집 실패가 있을 수 있습니다.','국내 종가와 미국 종가의 날짜가 다를 수 있어 방향 일치는 인과관계나 예측 성능이 아닙니다.','뉴스는 RSS 기사 제목이며 본문·전문가 발언을 확인하지 않았습니다.','v3.3의 사후 분석은 사전 예측 기록에 포함되지 않습니다.',...(v?.warnings||[])])add(warnings,'p','• '+t)}
async function load(){const [v,m,a,h,d]=await Promise.all([get('briefing_v36.json'),get('market.json'),get('analysis_v33.json'),get('v33_history.json'),get('domestic_v39.json')]);render(v,m,a,h,d)}$('refresh').onclick=load;load();
let libPromise;function library(){if(window.html2canvas)return Promise.resolve(window.html2canvas);if(!libPromise)libPromise=new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=()=>window.html2canvas?resolve(window.html2canvas):reject(Error('캡처 라이브러리 확인 실패'));s.onerror=()=>reject(Error('캡처 라이브러리 로딩 실패'));document.head.append(s)}).catch(e=>{libPromise=null;throw e});return libPromise}async function imageFile(){let cap=await library(),actions=$('actions'),old=actions.style.visibility;actions.style.visibility='hidden';try{let width=Math.max(document.body.scrollWidth,document.documentElement.clientWidth),height=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);if(width*height>45000000||height>16000)throw Error('페이지가 너무 깁니다. PDF 저장을 이용하세요.');let canvas=await cap(document.body,{backgroundColor:'#090e1a',scale:Math.min(devicePixelRatio||1,1.5),useCORS:true,logging:false,scrollY:-window.scrollY,windowWidth:width,windowHeight:height});let blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('PNG 변환 실패')),'image/png'));return new File([blob],'chati-briefing-v39.png',{type:'image/png'})}finally{actions.style.visibility=old}}function save(f){let url=URL.createObjectURL(f),a=document.createElement('a');a.href=url;a.download=f.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}function busy(b){$('capture').disabled=b;$('share').disabled=b}function msg(t){$('captureStatus').textContent=t}$('capture').onclick=async()=>{busy(true);msg('전체 화면 캡처 중…');try{save(await imageFile());msg('PNG 저장을 요청했습니다. 다운로드 폴더를 확인하세요.')}catch(e){msg('캡처 실패: '+e.message)}finally{busy(false)}};$('share').onclick=async()=>{busy(true);msg('공유 이미지 준비 중…');try{let f=await imageFile();if(navigator.canShare?.({files:[f]})&&navigator.share){await navigator.share({files:[f],title:'차티 글로벌 마켓 v3.9'});msg('공유 창을 열었습니다.')}else{save(f);msg('이미지 공유를 지원하지 않아 PNG로 저장했습니다.')}}catch(e){msg(e.name==='AbortError'?'공유 취소':'이미지 공유 실패: '+e.message)}finally{busy(false)}};$('print').onclick=()=>print();
</script></body></html>

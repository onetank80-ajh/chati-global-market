<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차티 글로벌 마켓 v3.7</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#090e1a;color:#eff4ff}*{box-sizing:border-box}body{max-width:1000px;margin:auto;padding:22px 15px 65px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:27px;letter-spacing:-.8px;margin:8px 0}h2{font-size:19px;margin:0 0 13px}h3{font-size:16px;margin:8px 0}p{line-height:1.65}.sub{font-size:13px;color:#a8bbd6;line-height:1.65}.card{background:#121d31;border:1px solid #31415e;border-radius:18px;padding:19px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#1b2942;border:1px solid #364b6c;padding:13px;border-radius:12px}.stat b{display:block;font-size:21px;margin:8px 0}.up{color:#ff9191}.down{color:#89c0ff}.tag{display:inline-block;padding:5px 10px;border:1px solid #62728e;border-radius:99px;font-size:12px;margin:3px 5px 3px 0}.warn{color:#ffd38b}.good{color:#94e1be}.panel{border-top:1px solid #34445e;padding:13px 0}.line{padding:8px 0;border-bottom:1px solid #2c3d57}a{color:#a4ccff;overflow-wrap:anywhere}button{background:#426cf5;color:white;border:0;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid #91dfff}ul{padding-left:20px}li{margin:7px 0}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:450px){h1{font-size:22px}.card{padding:15px}}
</style></head><body><header><div><div class="sub">CHATI · GLOBAL MARKET INTELLIGENCE</div><h1>글로벌 마켓 브리핑 <span class="tag">v3.7</span></h1><div id="clock" class="sub">자료 불러오는 중…</div></div><button id="refresh">새로고침</button></header>
<section class="card"><h2>오늘 분석의 유효성</h2><div id="status"></div><p class="sub">시장 지표는 일별 종가이며 실시간 호가가 아닙니다. 미국 시장 기준일과 한국 거래일이 다를 수 있습니다.</p></section>
<section class="card"><h2>미국 시장 4대 지표</h2><div id="markets" class="grid"></div></section>
<section class="card"><h2>미국 시장 → 국내 업종 영향</h2><div id="impact"></div><p class="sub">영향 방향은 조건부 관찰 가설입니다. 개별 종목의 실제 주가 상승·하락을 보장하지 않습니다.</p></section>
<section class="card"><h2>장 시작 후 확인할 신호</h2><div id="watch"></div></section>
<section class="card"><h2>코스피·코스닥 기존 분석</h2><div id="scenarios"></div></section>
<section class="card"><h2>근거 뉴스와 출처</h2><div id="news"></div></section>
<section class="card"><h2>검증 기록</h2><div id="history" class="sub">확인 중…</div></section>
<section class="card"><h2>자료 및 한계</h2><div id="warnings" class="sub"></div></section>
<script>
'use strict';const $=id=>document.getElementById(id);function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n}function add(p,tag,text,cls){const n=el(tag,text,cls);p.append(n);return n}function reset(id){const n=$(id);n.replaceChildren();return n}function percent(x){return typeof x==='number'&&Number.isFinite(x)?(x>0?'+':'')+x.toFixed(2)+'%':'자료 없음'}function date(x){const t=Date.parse(x||'');return Number.isFinite(t)?t:null}function link(p,item){if(!/^https:\/\//.test(item.url||''))return;const a=el('a',item.title||'원문 보기');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';p.append(a)}async function get(file){try{let r=await fetch('./data/'+file+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}catch{return null}}
function render(v,m,a,h){let now=Date.now(),snapshot=date(m?.generated_at_utc),age=snapshot===null?null:(now-snapshot)/3600000,newsTime=date(v?.generated_at_kst),newsAge=newsTime===null?null:(now-newsTime)/3600000;let valid=age!==null&&age>=0&&age<=12;let validNews=newsAge!==null&&newsAge>=0&&newsAge<=24;let pre=a?.analysis_mode==='premarket_reference'&&a?.eligible_for_prediction_record===true;
$('clock').textContent='화면 확인 시각: '+new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' · 데이터 생성: '+(v?.generated_at_kst||'없음');let s=reset('status');add(s,'strong',!v?'v3.6 데이터 없음':!valid?'주의 · 시장 데이터 오래됨':!validNews?'주의 · 뉴스 브리핑 오래됨':'참고 데이터 갱신 확인',!v||!valid||!validNews?'warn':'good');add(s,'p','시장 스냅샷: '+(age===null?'없음':age.toFixed(1)+'시간 전')+' · 뉴스 브리핑: '+(newsAge===null?'없음':newsAge.toFixed(1)+'시간 전'),'sub');add(s,'p',pre?'v3.3 사전 분석 표시(적중률 미검증)':'v3.3 사전 예측 유효성 미확인 · 과거/사후 참고 분석','warn');
let markets=m?.markets||{},marketBox=reset('markets');for(let [key,label] of [['sp500','S&P 500'],['nasdaq','나스닥'],['sox','반도체 SOX'],['usdkrw','달러/원']]){let x=markets[key]||{},b=el('div',undefined,'stat');add(b,'div',label,'sub');add(b,'b',percent(x.change_percent),typeof x.change_percent==='number'?(x.change_percent>0?'up':'down'):'');add(b,'div',x.market_date||'기준일 미상','sub');marketBox.append(b)}
let impact=reset('impact');let factors=[{name:'반도체 · 삼성전자 / SK하이닉스',key:'sox',positive:'미국 반도체 강세는 국내 반도체 투자심리에 우호적일 수 있음',negative:'미국 반도체 약세는 국내 반도체 변동성 확대 요인',check:'국내 반도체 대형주 시가·외국인 순매수·거래대금'},{name:'국내 기술주 · 코스닥 성장주',key:'nasdaq',positive:'나스닥 강세는 성장주 투자심리에 우호적일 수 있음',negative:'나스닥 약세는 고평가 성장주에 부담일 수 있음',check:'국내 성장주 거래대금·미국 금리 변화'},{name:'원화 민감 업종 · 외국인 수급',key:'usdkrw',positive:'달러/원 하락은 외국인 자금 흐름에 우호적일 수 있음',negative:'달러/원 상승은 외국인 수급 부담 요인일 수 있음',check:'원/달러 장중 변화·외국인 현물/선물 순매수',invert:true}];for(let f of factors){let x=markets[f.key]||{},value=x.change_percent,box=el('div',undefined,'panel');add(box,'h3',f.name);let stance=!valid||x.status!=='ok'||typeof value!=='number'?'데이터 미확인':Math.abs(value)<.3?'뚜렷한 방향 신호 없음':((value>0)!==!!f.invert?f.positive:f.negative);add(box,'p',stance);add(box,'div','확인 조건: '+f.check,'sub');impact.append(box)}
let watch=reset('watch');for(let t of ['08:00 NXT 개장 이후 전일 대비 갭과 거래대금 확인','09:00 정규장 초반 15~30분: 외국인 수급·상승 종목 확산 확인','반도체: SOX 방향과 삼성전자·SK하이닉스 실제 가격 흐름 일치 여부 확인','시장 지표 기준일이 다르거나 오래되면 신규 방향 판단 보류'])add(watch,'div','• '+t,'line');
let scenarios=reset('scenarios');add(scenarios,'div','v3.3 분석 모드: '+(a?.analysis_mode||'자료 없음'),'sub');for(let x of a?.scenarios||[]){let p=el('div',undefined,'panel');add(p,'strong',(x.market==='kospi'?'코스피':x.market==='kosdaq'?'코스닥':x.market)+' · '+x.bias);add(p,'div',x.reason||'','sub');scenarios.append(p)}if(!a?.scenarios?.length)add(scenarios,'p','시나리오 데이터 없음');
let n=reset('news');for(let x of (v?.headlines||[]).slice(0,12)){let row=el('div',undefined,'line');link(row,x);add(row,'div',(x.source||'출처 미상')+' · '+(x.published_at_utc||''),'sub');n.append(row)}if(!v?.headlines?.length)add(n,'p','최근 48시간의 뉴스 자료 없음','sub');
let hist=reset('history'),records=h?.records;if(Array.isArray(records)){let completed=records.filter(x=>x.settlement||x.settled_at_kst||x.status==='settled');add(hist,'p','저장된 기록: '+records.length+'건 · 결과 확인 표시: '+completed.length+'건');add(hist,'p','검증 파일의 세부 스키마와 정답 기준을 확인하기 전까지 적중률을 표시하지 않습니다.')}else add(hist,'p','검증 기록 파일 없음. 적중률 계산 불가.');
let w=reset('warnings');for(let t of ['뉴스는 공개 RSS 기사 제목을 분류한 것으로 본문이나 전문가 실제 발언을 분석하지 않았습니다.','국내 업종 영향은 조건부 관찰 가설이며 매매 신호가 아닙니다.','시장 데이터 출처: '+(m?.source||'미상'),'뉴스 출처: '+(v?.sources?.news||'미상'),...(v?.warnings||[])])add(w,'p','• '+t)}
async function load(){let [v,m,a,h]=await Promise.all([get('briefing_v36.json'),get('market.json'),get('analysis_v33.json'),get('v33_history.json')]);render(v,m,a,h)}$('refresh').onclick=load;load();
</script></body></html>

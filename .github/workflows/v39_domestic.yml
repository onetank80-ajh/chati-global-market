name: Chati v3.9 Domestic Daily Closes
on:
  workflow_dispatch:
  schedule:
    - cron: '10 7 * * 1-5' # 16:10 KST weekdays, after KRX regular close
permissions:
  contents: write
concurrency:
  group: chati-v39-domestic
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install yfinance
        run: python -m pip install 'yfinance>=0.2.60,<2'
      - name: Fetch domestic daily closes
        run: python scripts/domestic_update.py
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/domestic_v39.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update v3.9 domestic closes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Chati Morning Push v3
on:
  workflow_dispatch:
  schedule:
    # 07:30 KST weekdays (UTC 22:30 previous day)
    - cron: '30 22 * * 0-4'
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Send push (requires NTFY_TOPIC secret)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python scripts/push_briefing.py

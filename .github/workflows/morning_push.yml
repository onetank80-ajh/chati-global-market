name: Chati Morning Push v3.2
on:
  workflow_dispatch:
  schedule:
    # KST 07:25 primary, 07:40 backup (previous UTC day)
    - cron: '25 22 * * 0-4'
    - cron: '40 22 * * 0-4'
permissions:
  contents: write
concurrency:
  group: chati-morning-pipeline
  cancel-in-progress: false
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync latest repository
        run: git pull --rebase origin main
      - name: Decide if push already sent today
        id: status
        shell: python
        run: |
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo('Asia/Seoul')).date().isoformat()
          p = Path('data/push_status.json')
          try:
              last = json.loads(p.read_text(encoding='utf-8')).get('last_sent_date_kst')
          except (OSError, ValueError):
              last = None
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('send=' + ('false' if last == today else 'true') + '\n')
          print('KST date:', today, 'last sent:', last)
      - name: Check prepared briefing freshness
        id: prepared
        if: steps.status.outputs.send == 'true'
        shell: python
        run: |
          import json, os, math
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          ready = False
          try:
              market = json.loads(Path('data/market.json').read_text(encoding='utf-8'))
              morning = json.loads(Path('data/morning.json').read_text(encoding='utf-8'))
              stamp = market.get('generated_at_utc')
              generated = datetime.fromisoformat(stamp.replace('Z', '+00:00'))
              age = (datetime.now(timezone.utc) - generated).total_seconds()
              quotes = market.get('markets', {})
              required = ('sp500', 'sox', 'usdkrw')
              valid = all(
                  isinstance(quotes.get(k), dict)
                  and quotes[k].get('status') == 'ok'
                  and isinstance(quotes[k].get('close'), (int, float))
                  and not isinstance(quotes[k]['close'], bool)
                  and math.isfinite(quotes[k]['close'])
                  and quotes[k]['close'] > 0
                  for k in required
              )
              from datetime import timedelta
              today = datetime.now(ZoneInfo('Asia/Seoul')).date()
              expected = today - timedelta(days=3 if today.weekday() == 0 else 1)
              us_dates_valid = all(
                  expected - timedelta(days=1)
                  <= datetime.strptime(quotes[k]['market_date'], '%Y-%m-%d').date()
                  <= today for k in ('sp500', 'sox')
              )
              ready = (0 <= age <= 12 * 3600 and valid and us_dates_valid
                       and morning.get('market_snapshot_at') == market.get('generated_at_kst')
                       and morning.get('market_snapshot_fresh') is True
                       and generated.astimezone(ZoneInfo('Asia/Seoul')).date() == today)
          except (OSError, ValueError, TypeError, KeyError, AttributeError):
              ready = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('ready=' + str(ready).lower() + '\n')
          print('Prepared briefing ready:', ready)
      - name: Install dependencies
        if: steps.status.outputs.send == 'true' && steps.prepared.outputs.ready != 'true'
        run: python -m pip install --disable-pip-version-check yfinance==0.2.66
      - name: Refresh market (retry)
        if: steps.status.outputs.send == 'true' && steps.prepared.outputs.ready != 'true'
        run: |
          for attempt in 1 2 3; do
            python scripts/market_update.py && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
      - name: Refresh news
        if: steps.status.outputs.send == 'true' && steps.prepared.outputs.ready != 'true'
        run: python scripts/news_update.py
        continue-on-error: true
      - name: Refresh briefing
        if: steps.status.outputs.send == 'true' && steps.prepared.outputs.ready != 'true'
        run: python scripts/briefing_update.py
        continue-on-error: true
      - name: Refresh intelligence
        if: steps.status.outputs.send == 'true' && steps.prepared.outputs.ready != 'true'
        run: python scripts/intelligence_update.py
      - name: Build synchronized morning brief
        if: steps.status.outputs.send == 'true' && steps.prepared.outputs.ready != 'true'
        run: python scripts/morning_brief.py
      - name: Record premarket prediction
        if: steps.status.outputs.send == 'true' && steps.prepared.outputs.ready != 'true'
        run: python scripts/verify_market.py predict
      - name: Publish reports
        if: steps.status.outputs.send == 'true' && steps.prepared.outputs.ready != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json data/intelligence.json data/verification.json data/morning.json
          if [ -f data/news.json ]; then git add data/news.json; fi
          if [ -f data/briefing.json ]; then git add data/briefing.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update Chati morning briefing'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Wait until 07:30 KST
        if: steps.status.outputs.send == 'true'
        shell: python
        run: |
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import time
          now = datetime.now(ZoneInfo('Asia/Seoul'))
          target = now.replace(hour=7, minute=30, second=0, microsecond=0)
          if now < target:
              time.sleep((target-now).total_seconds())
      - name: Send push (retry)
        if: steps.status.outputs.send == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            python scripts/push_briefing.py && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 15
          done
      - name: Record successful delivery attempt
        if: steps.status.outputs.send == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Asia/Seoul'))
          p = Path('data/push_status.json')
          p.write_text(json.dumps({'last_sent_date_kst': now.date().isoformat(), 'last_sent_at_kst': now.isoformat(), 'note': 'ntfy HTTP success; device receipt not independently verified'}, indent=2)+'\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/push_status.json
          git commit -m 'Record Chati morning push'
          git pull --rebase origin main
          git push origin HEAD:main

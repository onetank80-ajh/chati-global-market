name: Chati v3.5 Expert Source Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install discovery and caption libraries
        run: python -m pip install 'yt-dlp>=2025.1' 'youtube-transcript-api>=1.2,<2'
      - name: Check two expert sources
        run: python scripts/expert_source_check.py --output v35_expert_source_status.json
      - name: Upload metadata only
        uses: actions/upload-artifact@v4
        with:
          name: v35-expert-source-status
          path: v35_expert_source_status.json
          retention-days: 7

name: Chati Korea Forecast Verification
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'predict or settle'
        required: true
        default: settle
        type: choice
        options: [predict, settle]
  schedule:
    # 07:20 KST weekdays
    - cron: '20 22 * * 0-4'
    # 17:45 KST weekdays
    - cron: '45 8 * * 1-5'
permissions:
  contents: write
concurrency:
  group: chati-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check yfinance==0.2.66
      - name: Generate prediction or settle results
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            mode="$MANUAL_MODE"
          elif [ "$SCHEDULE" = '20 22 * * 0-4' ]; then
            mode=predict
          else
            mode=settle
          fi
          python scripts/verify_market.py "$mode"
      - name: Commit verified data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/verification.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Korea forecast verification'
            git pull --rebase origin main
            git push origin HEAD:main

name: Chati v4.0 Theme Radar (EOD)
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1-5' # 16:30 KST weekdays
permissions:
  contents: write
concurrency:
  group: chati-v40-radar
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'pykrx>=1.0.48,<2' pandas requests
      - name: Scan KRX stocks
        run: python scripts/theme_radar_v40.py
      - name: Commit radar data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/theme_radar_v40.json ]; then git add data/theme_radar_v40.json; fi
          if [ -f data/theme_radar_v40_health.json ]; then git add data/theme_radar_v40_health.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh v4.0 theme radar'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Chati v4 Radar Offline Safety Check
on:
  push:
    paths:
      - 'scripts/theme_radar_v40.py'
      - '.github/workflows/v40_radar.yml'
      - '.github/workflows/v40_radar_check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Verify missing ranking sources do not erase last valid radar
        run: |
          python - <<'PY'
          import importlib.util, json, tempfile
          from pathlib import Path
          from unittest.mock import patch
          spec=importlib.util.spec_from_file_location('radar','scripts/theme_radar_v40.py')
          radar=importlib.util.module_from_spec(spec);spec.loader.exec_module(radar)
          with tempfile.TemporaryDirectory() as tmp:
              radar.OUT=Path(tmp)/'theme_radar_v40.json'
              previous={'market_date':'2026-10-23','daytrade_candidates':[{'ticker':'TEST'}]}
              original=json.dumps(previous)
              radar.OUT.write_text(original)
              with patch.object(radar,'fetch_rankings',side_effect=RuntimeError('offline test source failure')):
                  radar.main()
              assert radar.OUT.read_text()==original, 'Existing candidates overwritten'
              health=json.loads(radar.OUT.with_name('theme_radar_v40_health.json').read_text())
              assert health['status']=='SOURCE_UNAVAILABLE'
              assert health['candidate_data_updated'] is False
              assert len(health['errors'])==4
              print('PASS: source outage preserves candidates and reports error')
          PY

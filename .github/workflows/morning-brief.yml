name: Chati Morning Brief 0730 KST
on:
  # Scheduled generation is handled by market.yml at 07:00 KST.
  # Keep manual dispatch as a recovery option without daily Actions minutes.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chati-market-update
  cancel-in-progress: false
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync latest snapshots
        run: git pull --rebase origin main
      - name: Refresh derived intelligence from existing JSON snapshots
        run: python scripts/intelligence_update.py
      - name: Generate morning brief from existing JSON snapshots
        run: python scripts/morning_brief.py
      - name: Check briefing consistency before commit
        run: python scripts/check_consistency.py
      - name: Commit updated JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/morning.json data/intelligence.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update morning briefing data'
            git pull --rebase origin main
            python scripts/check_consistency.py
            git push origin HEAD:main
          fi

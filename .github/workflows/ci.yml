name: Chati Regression CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements*.txt'
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check yfinance==0.2.66
      - name: Compile Python scripts and tests before running them
        id: compile
        run: python -m compileall -q scripts tests
      - name: Run complete offline test suite
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Audit historical morning push timing (full Git history)
        if: matrix.python-version == '3.11'
        continue-on-error: true
        run: |
          git fetch --unshallow origin || git fetch origin main --depth=200
          python scripts/audit_push_history.py > push_history_audit.json
          python -c 'import json; d=json.load(open("push_history_audit.json")); print("Observed:", d["observed_days"], "On time:", d["on_time_days"], "Observed rate:", d["on_time_rate_observed_only"])'
      - name: Upload historical timing evidence
        if: matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: push-history-audit
          path: push_history_audit.json
          if-no-files-found: warn
      - name: Report regression result
        if: always()
        run: |
          echo "### Regression CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python: ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"

      # Persist CI outcomes even when tests fail, so status can be audited without
      # browsing a specific run ID. Each Python version writes its own file.
      - name: Publish machine-readable regression evidence
        if: always()
        continue-on-error: true
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          version = os.environ["PYTHON_VERSION"].replace(".", "")
          record = {
              "schema_version": 1,
              "source_commit": os.environ.get("GITHUB_SHA"),
              "python_version": os.environ["PYTHON_VERSION"],
              "compile_outcome": os.environ.get("COMPILE_OUTCOME"),
              "test_outcome": os.environ.get("TEST_OUTCOME"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_url": "{}/{}/actions/runs/{}".format(
                  os.environ.get("GITHUB_SERVER_URL", "https://github.com"),
                  os.environ.get("GITHUB_REPOSITORY", ""),
                  os.environ.get("GITHUB_RUN_ID", ""),
              ),
              "observed_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          target = Path(f"data/ci_health_py{version}.json")
          target.parent.mkdir(exist_ok=True)
          target.write_text(json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          file="data/ci_health_py${PYTHON_VERSION//./}.json"
          git add "$file"
          if ! git diff --quiet HEAD -- "$file"; then
            git commit --only "$file" -m "Record regression CI outcome for Python ${PYTHON_VERSION}"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi

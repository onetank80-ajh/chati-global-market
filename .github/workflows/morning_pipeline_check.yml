name: Chati Morning Pipeline Offline Check
on:
  push:
    paths:
      - 'scripts/morning_brief.py'
      - 'scripts/push_briefing.py'
      - '.github/workflows/morning_push.yml'
      - '.github/workflows/morning-brief.yml'
      - '.github/workflows/market.yml'
      - '.github/workflows/verification.yml'
      - '.github/workflows/morning_pipeline_check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile scripts/morning_brief.py scripts/push_briefing.py
      - name: Check workflow shell blocks and morning pipeline order
        shell: python
        run: |
          from pathlib import Path
          import re
          for name in ('market.yml','verification.yml'):
              s=(Path('.github/workflows')/name).read_text()
              block=s.split('run: |')[-1]
              assert re.search(r'^\s+fi\s*$',block,re.M), name+' missing fi'
          brief=Path('.github/workflows/morning-brief.yml').read_text()
          assert brief.index('Sync latest snapshots') < brief.index('Generate morning brief')
          s=Path('.github/workflows/morning_push.yml').read_text()
          order=('Refresh market (retry)','Refresh intelligence',
                 'Build synchronized morning brief','Publish reports',
                 'Send push (retry)')
          positions=[s.index(x) for x in order]
          assert positions==sorted(positions), 'morning pipeline out of order'
          # The 07:25 path must reuse a valid prebuilt snapshot instead of
          # unconditionally refetching and delaying the 07:30 notification.
          assert s.index('Check prepared briefing freshness') < s.index('Refresh market (retry)')
          assert "id: prepared" in s
          for step in ('Install dependencies', 'Refresh market (retry)',
                       'Refresh news', 'Refresh briefing', 'Refresh intelligence',
                       'Build synchronized morning brief'):
              block=s.split('      - name: '+step+'\n',1)[1].split('      - name: ',1)[0]
              assert "steps.prepared.outputs.ready != 'true'" in block, step+' must skip on fresh data'
          for step in ('Record premarket prediction', 'Publish reports'):
              block=s.split('      - name: '+step+'\n',1)[1].split('      - name: ',1)[0]
              assert "steps.status.outputs.send == 'true'" in block, step+' must run on prepared data'
          assert s.index('Wait until 07:30 KST') < s.index('Send push (retry)')
          assert 'market_snapshot_at' in s and 'market_snapshot_fresh' in s
          # Prepared fast path must reject stale US quotes before skipping refresh.
          prepared=s.split('      - name: Check prepared briefing freshness',1)[1].split('      - name: Install dependencies',1)[0]
          assert 'us_dates_valid' in prepared and 'market_date' in prepared
          assert 'and valid and us_dates_valid' in prepared
          # Push must independently refuse stale US closing dates.
          push=Path('scripts/push_briefing.py').read_text()
          assert 'Outdated US market close' in push
          assert 'for key in ("sp500", "sox")' in push
      - name: Verify late push is rejected without network
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast
          p=ast.parse(Path('scripts/push_briefing.py').read_text(encoding='utf-8'))
          fn=next(n for n in p.body if isinstance(n,ast.FunctionDef) and n.name=='main')
          checks=[n for n in ast.walk(fn) if isinstance(n,ast.Raise) and '08:00' in ast.unparse(n)]
          assert checks, 'Missing late-delivery cutoff'
          print('Late push cutoff is present')
          PY
      - name: Generate and validate offline briefing
        run: |
          python3 scripts/morning_brief.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/morning.json').read_text(encoding='utf-8'))
          assert isinstance(data['market_snapshot_fresh'],bool)
          assert 'market_snapshot_age_hours' in data
          assert isinstance(data['warnings'],list)
          print('Morning report schema OK; fresh:',data['market_snapshot_fresh'])
          PY

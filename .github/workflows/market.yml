name: Chati Global Market
on:
  workflow_dispatch:
  schedule:
    # Once at 07:00 KST weekdays; avoid duplicate market refresh billing.
    - cron: '0 22 * * 0-4'
permissions:
  contents: write
concurrency:
  group: chati-market-update
  cancel-in-progress: false
jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check yfinance==0.2.66
      - name: Offline regression tests (no extra job)
        run: python -m unittest discover -s tests -v
      - name: Fetch market snapshot
        run: python scripts/market_update.py
      - name: Fetch headlines
        run: python scripts/news_update.py
        continue-on-error: true
      - name: Generate existing briefing
        run: python scripts/briefing_update.py
        continue-on-error: true
      - name: Generate v1 intelligence
        run: python scripts/intelligence_update.py
      - name: Generate morning briefing from fresh snapshots
        run: python scripts/morning_brief.py
      - name: Check briefing consistency
        run: python scripts/check_consistency.py
      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/intelligence.json data/morning.json
          if [ -f data/news.json ]; then git add data/news.json; fi
          if [ -f data/briefing.json ]; then git add data/briefing.json; fi
          # Derived intelligence and morning briefing must be committed with every new market snapshot.
          if git diff --cached --name-only -- data/market.json | grep -qx 'data/market.json'; then
            for derived in data/intelligence.json data/morning.json; do
              if ! git diff --cached --name-only -- "$derived" | grep -qx "$derived"; then
                echo "FAIL: market.json changed without $derived; refusing partial publish" >&2
                exit 1
              fi
            done
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Chati market intelligence"
            git pull --rebase origin main
            python scripts/check_consistency.py
            git push origin HEAD:main
          fi
      - name: Publish snapshot diagnostics
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = ["## Chati market snapshot diagnostics", ""]
          for filename in ("market.json", "intelligence.json", "morning.json"):
              path = Path("data") / filename
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  generated = data.get("generated_at_kst") or data.get("generated_at_utc") or "missing"
                  source = data.get("market_snapshot_at") or "—"
                  lines.append(f"- **{filename}**: generated `{generated}`, market snapshot `{source}`")
              except (OSError, ValueError, AttributeError) as exc:
                  lines.append(f"- **{filename}**: unavailable ({type(exc).__name__})")
          lines.append("")
          lines.append("")
          lines.append("### Publication state")
          lines.append(f"- Job status: \`{os.environ.get('JOB_STATUS', 'unknown')}\`")
          lines.append("- Failed jobs do not publish new snapshots unless the commit/push step completed.")
          lines.append("- Inspect the failing step logs for the underlying provider or Git error.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

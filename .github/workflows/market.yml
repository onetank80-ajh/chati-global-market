name: Chati Global Market
on:
  workflow_dispatch:
  schedule:
    # 07:30 KST (primary), 07:40 KST (backup). GitHub schedules may be delayed.
    - cron: '30 22 * * 0-4'
    - cron: '40 22 * * 0-4'
permissions:
  contents: write
concurrency:
  group: chati-market-update
  cancel-in-progress: false
jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check yfinance==0.2.66
      - name: Fetch market snapshot
        run: python scripts/market_update.py
      - name: Fetch headlines
        run: python scripts/news_update.py
        continue-on-error: true
      - name: Generate existing briefing
        run: python scripts/briefing_update.py
        continue-on-error: true
      - name: Generate v1 intelligence
        run: python scripts/intelligence_update.py
      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/intelligence.json
          if [ -f data/news.json ]; then git add data/news.json; fi
          if [ -f data/briefing.json ]; then git add data/briefing.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Chati market intelligence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Chati Global Market
on:
  workflow_dispatch:
  schedule:
    # Start at 06:30 KST weekdays to allow upstream retries before 07:30 briefing.
    # 21:30 UTC Sunday-Thursday = 06:30 KST Monday-Friday.
    # GitHub scheduled runs can be delayed; this is a buffer, not a guarantee.
    - cron: '30 21 * * 0-4'
    # Backup at 06:50 KST if the 06:30 scheduled run is delayed or dropped.
    - cron: '50 21 * * 0-4'
    # Final pre-deadline retry at 07:05 KST if earlier scheduled runs were dropped.
    - cron: '5 22 * * 0-4'
permissions:
  contents: write
concurrency:
  group: chati-market-update
  cancel-in-progress: false
jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Capture a run identifier before any dependency installation or market fetch.
      # This breadcrumb is best-effort and must not delay critical data work.
      - name: Record run start in job summary
        run: |
          echo "run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} event=${GITHUB_EVENT_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check yfinance==0.2.66
      - name: Print refresh context
        run: |
          echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "KST: $(TZ=Asia/Seoul date '+%Y-%m-%dT%H:%M:%S%z')"
          echo "Commit: ${GITHUB_SHA}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Run: ${GITHUB_RUN_ID}"
          echo "PIPELINE_START_UTC=$(date -u +%s)" >> "$GITHUB_ENV"
          echo "TRIGGER_CRON=${{ github.event.schedule }}" >> "$GITHUB_ENV"
          echo "TRIGGER_EVENT=${GITHUB_EVENT_NAME}" >> "$GITHUB_ENV"
          python - <<'PY'
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          schedules = {"30 21 * * 0-4": (21, 30), "50 21 * * 0-4": (21, 50), "5 22 * * 0-4": (22, 5)}
          cron = "${{ github.event.schedule }}"
          expected = schedules.get(cron)
          if expected:
              planned = now.replace(hour=expected[0], minute=expected[1], second=0, microsecond=0)
              # Runs can start after midnight UTC; preserve the previous
              # day's scheduled trigger rather than reporting a negative delay.
              if planned > now:
                  from datetime import timedelta
                  planned -= timedelta(days=1)
              delay = int((now - planned).total_seconds())
              print(f"market_schedule_delay_seconds={delay}")
          else:
              print("market_schedule_delay_seconds=not_scheduled")
          PY
      - name: Required scheduling and freshness guard tests
        run: python -m unittest discover -s tests -p 'test_market_schedule.py' -v && python -m unittest discover -s tests -p 'test_consistency_recovery_window.py' -v && python -m unittest discover -s tests -p 'test_morning_deadline.py' -v && python -m unittest discover -s tests -p 'test_market_fail_fast.py' -v
      - name: Fetch market snapshot
        id: market_fetch
        run: |
          # Retry transient upstream quote failures; do not publish partial snapshots.
          for attempt in 1 2 3; do
            if python scripts/market_update.py; then
              echo "Market snapshot fetched on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Market fetch failed (attempt ${attempt}/3); retrying in 20 seconds"
              sleep 20
            fi
          done
          echo "Market fetch failed after 3 attempts; keeping previous snapshot" >&2
          exit 1
      - name: Preserve market failure evidence
        if: failure()
        run: |
          echo "::error::Market pipeline failed. Inspect the first failed step and its per-symbol quote logs."
          echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Run ID: ${GITHUB_RUN_ID}"
          echo "Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Checked out commit: ${GITHUB_SHA}"
          git status --short
      - name: Generate v1 intelligence
        run: python scripts/intelligence_update.py
      - name: Generate morning briefing from fresh snapshots
        run: python scripts/morning_brief.py
      - name: Check briefing consistency
        run: python scripts/check_consistency.py
      - name: Commit data files
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The critical publication must contain only mutually consistent
          # market/intelligence/morning data. Optional legacy files are
          # committed later in their own best-effort stage.
          git add data/market.json data/intelligence.json data/morning.json
          # Derived intelligence and morning briefing must be committed with every new market snapshot.
          if git diff --cached --name-only -- data/market.json | grep -qx 'data/market.json'; then
            for derived in data/intelligence.json data/morning.json; do
              if ! git diff --cached --name-only -- "$derived" | grep -qx "$derived"; then
                echo "FAIL: market.json changed without $derived; refusing partial publish" >&2
                exit 1
              fi
            done
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Chati market intelligence"
            git pull --rebase origin main
            python scripts/check_consistency.py
            git push origin HEAD:main
            echo "PUBLISHED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          fi
      # Persist independently readable evidence of a successful critical push.
      # Best-effort: telemetry must never block the briefing itself.
      - name: Publish machine-readable pipeline evidence
        if: env.PUBLISHED_UTC != ''
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          now = datetime.now(timezone.utc)
          started = datetime.fromtimestamp(int(os.environ["PIPELINE_START_UTC"]), timezone.utc)
          cron = os.environ.get("TRIGGER_CRON", "")
          schedules = {"30 21 * * 0-4": (21, 30), "50 21 * * 0-4": (21, 50), "5 22 * * 0-4": (22, 5)}
          planned = None
          delay = None
          if cron in schedules:
              hour, minute = schedules[cron]
              planned_dt = started.replace(hour=hour, minute=minute, second=0, microsecond=0)
              if planned_dt > started:
                  planned_dt -= timedelta(days=1)
              planned = planned_dt.isoformat()
              delay = int((started - planned_dt).total_seconds())
          evidence = {
              "schema_version": 1,
              "result": "critical_snapshot_pushed",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "trigger": os.environ.get("TRIGGER_EVENT"),
              "trigger_cron": cron or None,
              "scheduled_at_utc": planned,
              "started_at_utc": started.isoformat(),
              "schedule_delay_seconds": delay,
              "published_at_utc": os.environ["PUBLISHED_UTC"],
              "observed_at_utc": now.isoformat(),
              "source_commit": os.environ.get("GITHUB_SHA"),
          }
          Path("data/pipeline_health.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git add data/pipeline_health.json
          if ! git diff --cached --quiet; then
            git commit --only data/pipeline_health.json -m "Record successful Chati briefing publication"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      # Optional legacy data is generated only after the critical morning
      # snapshot has already been pushed. Its failure must not delay or
      # invalidate the main publication.
      # Keep optional stages within a short fixed budget so the core
      # market/intelligence/morning publication takes priority.
      - name: Fetch headlines (optional, max 15s)
        run: timeout 15s python scripts/news_update.py
        continue-on-error: true
      - name: Generate existing briefing (optional, max 10s)
        run: timeout 10s python scripts/briefing_update.py
        continue-on-error: true
      - name: Publish optional legacy data
        continue-on-error: true
        run: |
          # Both legacy files are optional and may not exist in a fresh checkout.
          # Stage only files that exist; avoid fatal pathspec errors.
          for legacy in data/news.json data/briefing.json; do
            if [ -f "$legacy" ]; then git add -- "$legacy"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update optional Chati news and legacy briefing"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Offline regression tests (report failures without blocking market refresh)
        id: regressions
        continue-on-error: true
        run: python -m unittest discover -s tests -v
      - name: Publish snapshot diagnostics
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          MARKET_FETCH_OUTCOME: ${{ steps.market_fetch.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regressions.outcome }}
          PIPELINE_START_UTC: ${{ env.PIPELINE_START_UTC }}
          TRIGGER_CRON: ${{ env.TRIGGER_CRON }}
          TRIGGER_EVENT: ${{ env.TRIGGER_EVENT }}
          PUBLISHED_UTC: ${{ env.PUBLISHED_UTC }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = ["## Chati market snapshot diagnostics", ""]
          market_generated = None
          for filename in ("market.json", "intelligence.json", "morning.json"):
              path = Path("data") / filename
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  generated = data.get("generated_at_kst") or data.get("generated_at_utc") or "missing"
                  source = data.get("market_snapshot_at") or "—"
                  lines.append(f"- **{filename}**: generated `{generated}`, market snapshot `{source}`")
                  if filename == "market.json":
                      market_generated = generated
                  elif source == "—":
                      lines.append("  - Snapshot drift: unavailable (missing market_snapshot_at)")
                  else:
                      from datetime import datetime
                      try:
                          if market_generated is None:
                              raise ValueError("market snapshot missing")
                          market_stamp = datetime.fromisoformat(market_generated.replace("Z", "+00:00"))
                          derived_stamp = datetime.fromisoformat(source.replace("Z", "+00:00"))
                          if market_stamp.tzinfo is None or derived_stamp.tzinfo is None:
                              raise ValueError("timestamp lacks timezone")
                          drift = abs((market_stamp - derived_stamp).total_seconds())
                          lines.append(f"  - Snapshot drift: `{drift:.1f}s` (allowed: 2s)")
                      except (ValueError, TypeError, AttributeError):
                          lines.append("  - Snapshot drift: unavailable (invalid timestamp)")
              except (OSError, ValueError, AttributeError) as exc:
                  lines.append(f"- **{filename}**: unavailable ({type(exc).__name__})")
          lines.append("")
          lines.append("### Publication state")
          from datetime import datetime, timezone, timedelta
          now_utc = datetime.now(timezone.utc)
          start_raw = os.environ.get("PIPELINE_START_UTC", "")
          try:
              started = datetime.fromtimestamp(int(start_raw), tz=timezone.utc)
              lines.append(f"- Workflow steps elapsed: {(now_utc - started).total_seconds():.0f}s (from context step)")
          except (ValueError, OverflowError, OSError):
              lines.append("- Workflow steps elapsed: unavailable")
          kst = timezone(timedelta(hours=9))
          local = now_utc.astimezone(kst)
          deadline = local.replace(hour=7, minute=30, second=0, microsecond=0)
          lines.append(f"- Diagnostics at KST: {local.isoformat(timespec='seconds')}")
          lines.append(f"- 07:30 KST deadline already passed: {local > deadline}")
          published_raw = os.environ.get("PUBLISHED_UTC", "")
          if published_raw:
              published = datetime.fromisoformat(published_raw.replace("Z", "+00:00")).astimezone(kst)
              publish_deadline = published.replace(hour=7, minute=30, second=0, microsecond=0)
              lines.append(f"- Git push completed at KST: `{published.isoformat(timespec='seconds')}`")
              lines.append(f"- Published by 07:30 KST: `{published <= publish_deadline}`")
          else:
              lines.append("- Published by 07:30 KST: `not confirmed (no successful push in this run)`")
          trigger = os.environ.get("TRIGGER_CRON", "")
          lines.append(f"- Trigger: `{os.environ.get('TRIGGER_EVENT', 'unknown')}`, cron: `{trigger or 'n/a'}`")
          expected = {"30 21 * * 0-4": (6, 30), "50 21 * * 0-4": (6, 50), "5 22 * * 0-4": (7, 5)}.get(trigger)
          if expected:
              scheduled = local.replace(hour=expected[0], minute=expected[1], second=0, microsecond=0)
              delay = (started.astimezone(kst) - scheduled).total_seconds() / 60 if start_raw.isdigit() else None
              if delay is not None:
                  lines.append(f"- Scheduled trigger to context-step delay: `{delay:.1f} min` (includes runner setup; not pure GitHub queue delay)")
              else:
                  lines.append("- Scheduled trigger delay: unavailable")
          lines.append(f"- Market fetch outcome: `{os.environ.get('MARKET_FETCH_OUTCOME', 'unknown')}`")
          lines.append(f"- Regression test outcome: `{os.environ.get('REGRESSION_OUTCOME', 'unknown')}`")
          lines.append(f"- Publish step outcome: `{os.environ.get('PUBLISH_OUTCOME', 'unknown')}`")
          lines.append(f"- Job status: `{os.environ.get('JOB_STATUS', 'unknown')}`")
          lines.append("- A successful publish step means its commands completed; inspect the Git log for whether a new commit was needed.")
          lines.append("- Inspect the failing step logs for the underlying provider or Git error.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

      # Best-effort failure breadcrumb; absence still cannot prove the run never started.
      - name: Publish failed-run evidence
        if: failure()
        continue-on-error: true
        env:
          MARKET_FETCH_OUTCOME: ${{ steps.market_fetch.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          record = {
              "schema_version": 1,
              "result": "market_workflow_failed",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "trigger": os.environ.get("GITHUB_EVENT_NAME"),
              "trigger_cron": os.environ.get("TRIGGER_CRON") or None,
              "market_fetch_outcome": os.environ.get("MARKET_FETCH_OUTCOME") or None,
              "publish_outcome": os.environ.get("PUBLISH_OUTCOME") or None,
              "observed_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          Path("data/pipeline_failure.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never include staged market files from a failed critical publication.
          git add data/pipeline_failure.json
          if ! git diff --quiet HEAD -- data/pipeline_failure.json; then
            git commit --only data/pipeline_failure.json -m "Record failed Chati market workflow run"
            # Earlier failed steps can leave modified working files; autostash prevents rebase refusal.
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi

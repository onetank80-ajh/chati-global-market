name: Chati Global Market
on:
  workflow_dispatch:
  schedule:
    # Start at 06:30 KST weekdays to allow upstream retries before 07:30 briefing.
    # 21:30 UTC Sunday-Thursday = 06:30 KST Monday-Friday.
    # GitHub scheduled runs can be delayed; this is a buffer, not a guarantee.
    - cron: '30 21 * * 0-4'
    # Backup at 06:50 KST if the 06:30 scheduled run is delayed or dropped.
    - cron: '50 21 * * 0-4'
permissions:
  contents: write
concurrency:
  group: chati-market-update
  cancel-in-progress: false
jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check yfinance==0.2.66
      - name: Print refresh context
        run: |
          echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "KST: $(TZ=Asia/Seoul date '+%Y-%m-%dT%H:%M:%S%z')"
          echo "Commit: ${GITHUB_SHA}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Run: ${GITHUB_RUN_ID}"
          echo "PIPELINE_START_UTC=$(date -u +%s)" >> "$GITHUB_ENV"
      - name: Offline regression tests (report failures without blocking market refresh)
        id: regressions
        continue-on-error: true
        run: python -m unittest discover -s tests -v
      - name: Required scheduling and freshness guard tests
        run: python -m unittest discover -s tests -p 'test_market_schedule.py' -v && python -m unittest discover -s tests -p 'test_consistency_recovery_window.py' -v
      - name: Fetch market snapshot
        id: market_fetch
        run: |
          # Retry transient upstream quote failures; do not publish partial snapshots.
          for attempt in 1 2 3; do
            if python scripts/market_update.py; then
              echo "Market snapshot fetched on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Market fetch failed (attempt ${attempt}/3); retrying in 20 seconds"
              sleep 20
            fi
          done
          echo "Market fetch failed after 3 attempts; keeping previous snapshot" >&2
          exit 1
      - name: Preserve market failure evidence
        if: failure()
        run: |
          echo "::error::Market pipeline failed. Inspect the first failed step and its per-symbol quote logs."
          echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Run ID: ${GITHUB_RUN_ID}"
          echo "Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Checked out commit: ${GITHUB_SHA}"
          git status --short
      # Optional news and legacy briefing must not consume the 07:30 deadline.
      - name: Fetch headlines (optional, max 45s)
        run: timeout 45s python scripts/news_update.py
        continue-on-error: true
      - name: Generate existing briefing (optional, max 20s)
        run: timeout 20s python scripts/briefing_update.py
        continue-on-error: true
      - name: Generate v1 intelligence
        run: python scripts/intelligence_update.py
      - name: Generate morning briefing from fresh snapshots
        run: python scripts/morning_brief.py
      - name: Check briefing consistency
        run: python scripts/check_consistency.py
      - name: Commit data files
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/intelligence.json data/morning.json
          if [ -f data/news.json ]; then git add data/news.json; fi
          if [ -f data/briefing.json ]; then git add data/briefing.json; fi
          # Derived intelligence and morning briefing must be committed with every new market snapshot.
          if git diff --cached --name-only -- data/market.json | grep -qx 'data/market.json'; then
            for derived in data/intelligence.json data/morning.json; do
              if ! git diff --cached --name-only -- "$derived" | grep -qx "$derived"; then
                echo "FAIL: market.json changed without $derived; refusing partial publish" >&2
                exit 1
              fi
            done
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Chati market intelligence"
            git pull --rebase origin main
            python scripts/check_consistency.py
            git push origin HEAD:main
          fi
      - name: Publish snapshot diagnostics
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          MARKET_FETCH_OUTCOME: ${{ steps.market_fetch.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regressions.outcome }}
          PIPELINE_START_UTC: ${{ env.PIPELINE_START_UTC }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = ["## Chati market snapshot diagnostics", ""]
          market_generated = None
          for filename in ("market.json", "intelligence.json", "morning.json"):
              path = Path("data") / filename
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  generated = data.get("generated_at_kst") or data.get("generated_at_utc") or "missing"
                  source = data.get("market_snapshot_at") or "—"
                  lines.append(f"- **{filename}**: generated `{generated}`, market snapshot `{source}`")
                  if filename == "market.json":
                      market_generated = generated
                  elif source == "—":
                      lines.append("  - Snapshot drift: unavailable (missing market_snapshot_at)")
                  else:
                      from datetime import datetime
                      try:
                          if market_generated is None:
                              raise ValueError("market snapshot missing")
                          market_stamp = datetime.fromisoformat(market_generated.replace("Z", "+00:00"))
                          derived_stamp = datetime.fromisoformat(source.replace("Z", "+00:00"))
                          if market_stamp.tzinfo is None or derived_stamp.tzinfo is None:
                              raise ValueError("timestamp lacks timezone")
                          drift = abs((market_stamp - derived_stamp).total_seconds())
                          lines.append(f"  - Snapshot drift: `{drift:.1f}s` (allowed: 2s)")
                      except (ValueError, TypeError, AttributeError):
                          lines.append("  - Snapshot drift: unavailable (invalid timestamp)")
              except (OSError, ValueError, AttributeError) as exc:
                  lines.append(f"- **{filename}**: unavailable ({type(exc).__name__})")
          lines.append("")
          lines.append("### Publication state")
          from datetime import datetime, timezone, timedelta
          now_utc = datetime.now(timezone.utc)
          start_raw = os.environ.get("PIPELINE_START_UTC", "")
          try:
              started = datetime.fromtimestamp(int(start_raw), tz=timezone.utc)
              lines.append(f"- Workflow steps elapsed: {(now_utc - started).total_seconds():.0f}s (from context step)")
          except (ValueError, OverflowError, OSError):
              lines.append("- Workflow steps elapsed: unavailable")
          kst = timezone(timedelta(hours=9))
          local = now_utc.astimezone(kst)
          deadline = local.replace(hour=7, minute=30, second=0, microsecond=0)
          lines.append(f"- Diagnostics at KST: {local.isoformat(timespec='seconds')}")
          lines.append(f"- 07:30 KST deadline already passed: {local > deadline}")
          lines.append(f"- Market fetch outcome: `{os.environ.get('MARKET_FETCH_OUTCOME', 'unknown')}`")
          lines.append(f"- Regression test outcome: `{os.environ.get('REGRESSION_OUTCOME', 'unknown')}`")
          lines.append(f"- Publish step outcome: `{os.environ.get('PUBLISH_OUTCOME', 'unknown')}`")
          lines.append(f"- Job status: `{os.environ.get('JOB_STATUS', 'unknown')}`")
          lines.append("- A successful publish step means its commands completed; inspect the Git log for whether a new commit was needed.")
          lines.append("- Inspect the failing step logs for the underlying provider or Git error.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

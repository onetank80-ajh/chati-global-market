name: Chati Global Market

on:
  workflow_dispatch:
  schedule:
    # 07:30 KST Monday-Friday = 22:30 UTC Sunday-Thursday
    - cron: '30 22 * * 0-4'

permissions:
  contents: write

concurrency:
  group: chati-market-update
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data client
        run: python -m pip install --disable-pip-version-check yfinance==0.2.66
      - name: Fetch market snapshot
        run: python scripts/market_update.py
      - name: Commit market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if ! git diff --cached --quiet; then
            git commit -m "Update market snapshot"
            git push
          fi

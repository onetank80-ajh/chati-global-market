name: Chati v3.4 YouTube Caption Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install caption client
        run: python -m pip install 'youtube-transcript-api>=1.2,<2'
      - name: Probe Osun Oct 19 broadcast (metadata only in logs)
        run: python scripts/youtube_caption_probe.py 'https://www.youtube.com/watch?v=BeeIcWciVI0' --output caption_probe_private.json
      - name: Verify JSON and print metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('caption_probe_private.json').read_text(encoding='utf-8'))
          for key in ('status','video_id','language','caption_characters','error_type','error_category'):
              print(f'{key}: {data.get(key)}')
          PY
